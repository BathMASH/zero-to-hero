project:
  output-dir: docs
  type: book

book:
  title: "Zero to Hero"
  author: "Ed Southwood"
# date removed from here and added to the index.qmd to enable using
# r code for automatic date
  search: true
  reader-mode: true
  repo-url: https://github.com/BathMASH/zero-to-hero
  repo-branch: master
  repo-actions: [source, issue]
  downloads: [pdf]
#  downloads: [pdf, docx, epub]

  margin-footer: "margin-footer.md"

format:
  html:
    css: styles.css
    theme:
      light: cosmo
      dark: darkly
    include-in-header:
      text: |
        <script type="application/javascript" src="scripts/wait.js"></script>
    
    include-after-body:
      text: |
        <!-- Cloudflare Web Analytics --><script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "45c34618a8294826b85725434b26e3db"}'></script><!-- End Cloudflare Web Analytics -->
        <script type="application/javascript" src="scripts/light-dark.js"></script>
  pdf:
    documentclass: scrbook
    classoption: oneside
    papersize: a4
    include-in-header:
      file: "preamble.tex"
#  docx:
#    toc: true
#    number-sections: true
#    highlight-style: github
#  epub:
#    toc: true
#    html-math-method: mathjax

knitr:
  opts_chunk:
    dev: 'png'

# Local execute cache moved to _quarto-all.yml to keep _quarto.yml aligned
# with upstream. See AGENTS.md for the base/econ content workflow.

profile:
  default: all

